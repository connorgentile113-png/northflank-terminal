# =============================================================================
#  nginx.conf — the single HTTP surface the browser is allowed to talk to.
#
#  Everything the browser loads comes from this one server on :8080, which
#  ngrok tunnels to the public internet. The browser never contacts any other
#  host (no CDNs, no unpkg, no Firebase SDK); the only exception in the UI is
#  a Google Fonts stylesheet.
#
#  Routes
#    /                 static landing page + terminal UI   (/var/www/index.html)
#    /terminal[/...]   ttyd on 127.0.0.1:7681  (ttyd is started with
#                      --base-path /terminal, so the prefix must be preserved)
#    /port/<PORT>/...  anything listening on 127.0.0.1:<PORT> in the container,
#                      with absolute asset paths rewritten through the prefix
# =============================================================================

user  www-data;
worker_processes  auto;
pid /run/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log  /dev/stdout main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   75s;
    server_tokens       off;
    absolute_redirect   off;

    # Generous limits: pasting code into the terminal, uploading files to a dev
    # server, and `git clone` style workloads all come through here.
    client_max_body_size 512m;
    client_body_timeout  300s;

    # WebSocket upgrade handling. This is what makes the ttyd terminal work and
    # also keeps Vite / webpack / LiveReload HMR sockets alive through the proxy.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css text/javascript application/javascript
                    application/json application/xml image/svg+xml;

    server {
        # IPv4 only: ngrok and the platform's load balancer both reach the
        # container over IPv4, and binding [::] fails to start on hosts where
        # IPv6 is disabled.
        listen      8080 default_server;
        server_name _;

        charset utf-8;
        root  /var/www;
        index index.html;

        # ---------------------------------------------------------------------
        # Landing page + terminal UI (fully self-contained index.html)
        # ---------------------------------------------------------------------
        location = / {
            add_header Cache-Control "no-store, must-revalidate";
            try_files /index.html =404;
        }

        location = /index.html {
            add_header Cache-Control "no-store, must-revalidate";
        }

        # Northflank / Docker health check. GET / also returns 200.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /favicon.ico {
            access_log off;
            return 204;
        }

        # ---------------------------------------------------------------------
        # ttyd  ->  /terminal/
        #
        # proxy_pass deliberately has no URI part: ttyd must see the full
        # /terminal/... path because the server was started with
        # --base-path /terminal (it answers /terminal, /terminal/, /terminal/token
        # and the /terminal/ws WebSocket, and 404s everything else).
        # ---------------------------------------------------------------------
        location /terminal {
            proxy_pass http://127.0.0.1:7681;

            proxy_http_version 1.1;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;

            proxy_buffering    off;   # interactive terminal: never buffer output
            proxy_read_timeout 7d;    # idle shells stay connected
            proxy_send_timeout 7d;

            include /etc/nginx/snippets/optional-auth.conf;
        }

        # ---------------------------------------------------------------------
        # Live port previews  ->  /port/<PORT>/
        # ---------------------------------------------------------------------

        # Port 8080 is this proxy itself. Proxying /port/8080/ to
        # 127.0.0.1:8080 would loop back into nginx forever (and eat the
        # container's memory), so it gets an explanation instead of a recursion.
        location ~ ^/port/8080(?:/|$) {
            default_type text/html;
            add_header Cache-Control "no-store";
            return 200 '<!doctype html><meta charset="utf-8"><title>Port 8080 is reserved</title><h1>Port 8080 is reserved</h1><p>Port 8080 is the port this proxy listens on, so proxying it to localhost:8080 would loop back into nginx forever. Start your app on another port (3000, 4200, 5173, 8000, 8888 or any free port) and open it from the Ports panel.</p>';
        }

        # /port/3000 -> /port/3000/  (keeps relative URLs resolving correctly)
        location ~ ^/port/([0-9]+)$ {
            return 301 /port/$1/;
        }

        # Any port, including ones typed into the Ports panel at runtime.
        location ~ ^/port/(?<pport>[0-9]+)(?<prest>/.*)$ {
            include /etc/nginx/snippets/optional-auth.conf;

            # With variables in proxy_pass nginx passes the URI as written and
            # does *not* append the query string, so it is appended by hand.
            proxy_pass http://127.0.0.1:$pport$prest$is_args$args;

            proxy_http_version 1.1;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /port/$pport;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;

            # sub_filter cannot rewrite a body it cannot read: if the upstream
            # gzips the response, the asset paths stay broken.
            proxy_set_header Accept-Encoding "";

            # Buffering stays ON here (unlike the terminal) so that rewritten
            # tags are not split across chunks. WebSocket upgrades are unaffected.
            proxy_read_timeout 7d;
            proxy_send_timeout 7d;

            # Location: /foo  or  Location: http://host:3000/foo -> /port/3000/foo
            proxy_redirect ~^(?:https?://[^/]+)?/(.*)$ /port/$pport/$1;
            proxy_cookie_path / /port/$pport/;

            # -----------------------------------------------------------------
            # Asset path rewriting.
            #
            # Relative paths ("assets/app.js") already resolve correctly because
            # the document is served *under* /port/<PORT>/. Absolute paths
            # ("/assets/app.js") would escape the prefix and 404, so they are
            # rewritten to "/port/<PORT>/assets/app.js".
            # -----------------------------------------------------------------
            sub_filter_once  off;
            sub_filter_types text/html text/css text/javascript
                             application/javascript application/x-javascript
                             application/json application/manifest+json
                             image/svg+xml;

            sub_filter 'src="/'            'src="/port/$pport/';
            sub_filter 'href="/'           'href="/port/$pport/';
            sub_filter 'srcset="/'         'srcset="/port/$pport/';
            sub_filter 'action="/'         'action="/port/$pport/';
            sub_filter 'poster="/'         'poster="/port/$pport/';
            sub_filter 'data-src="/'       'data-src="/port/$pport/';
            sub_filter "url(/"             "url(/port/$pport/";
            sub_filter "fetch('/"          "fetch('/port/$pport/";
            sub_filter "import('/"         "import('/port/$pport/";
            sub_filter "from '/"           "from '/port/$pport/";

            # Framework / bundler roots that are quoted in JS and JSON payloads
            sub_filter '"/assets/'         '"/port/$pport/assets/';
            sub_filter '"/static/'         '"/port/$pport/static/';
            sub_filter '"/build/'          '"/port/$pport/build/';
            sub_filter '"/dist/'           '"/port/$pport/dist/';
            sub_filter '"/src/'            '"/port/$pport/src/';
            sub_filter '"/_next/'          '"/port/$pport/_next/';
            sub_filter '"/public/'         '"/port/$pport/public/';
            sub_filter '"/node_modules/'   '"/port/$pport/node_modules/';
            sub_filter '"/@vite/'          '"/port/$pport/@vite/';
            sub_filter '"/@react-refresh'  '"/port/$pport/@react-refresh';
            sub_filter '"/@id/'            '"/port/$pport/@id/';
            sub_filter '"/@fs/'            '"/port/$pport/@fs/';
            sub_filter '"/__vite'          '"/port/$pport/__vite';
            sub_filter '"/sockjs-node'     '"/port/$pport/sockjs-node';
        }

        # ---------------------------------------------------------------------
        # Anything else: plain static files under /var/www (add files here if
        # the UI ever needs more than the single inlined index.html).
        # ---------------------------------------------------------------------
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
