; =============================================================================
;  supervisord.conf — process supervision for the whole container.
;
;  Four long-lived processes, all restarted on crash and all logging to the
;  container's stdout/stderr so they show up in the Northflank log view:
;
;    nginx                the single HTTP surface (and the tunnel target)
;    ttyd                 the web terminal behind /terminal/
;    ngrok                the public tunnel for :8080
;    tunnel-url-writer    ngrok local API -> Firebase REST PUT (server side)
;    keepalive            heartbeat so the free tier never idles the service out
;
;  Every environment variable referenced through supervisord's ENV_
;  interpolation below is exported by entrypoint.sh (with a default) before
;  supervisord starts — supervisord refuses to parse a format string that
;  references a variable which is undefined in its environment.
; =============================================================================

[supervisord]
nodaemon      = true
user          = root
logfile       = /dev/null
logfile_maxbytes = 0
pidfile       = /run/supervisord.pid
childlogdir   = /tmp
loglevel      = info

[unix_http_server]
file  = /run/supervisor.sock
chmod = 0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl = unix:///run/supervisor.sock

; -----------------------------------------------------------------------------
; nginx — serves /, /terminal/ and /port/<PORT>/
; -----------------------------------------------------------------------------
[program:nginx]
command                 = /usr/sbin/nginx -g "daemon off;"
priority                = 10
autostart               = true
autorestart             = true
startsecs                = 2
startretries            = 1000
stopwaitsecs            = 15
stopsignal              = TERM
redirect_stderr         = false
stdout_logfile          = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile          = /dev/stderr
stderr_logfile_maxbytes = 0

; -----------------------------------------------------------------------------
; ttyd — the terminal itself.
;
;   --writable          lets the user actually type (read-only otherwise)
;   --base-path         ttyd 1.7.x option: serve under /terminal so nginx can
;                       proxy the prefix through unchanged (assets and the
;                       /terminal/ws WebSocket stay on the tunnel origin)
;   --terminal-type     xterm-256color for nano / vim / htop colours
;   /bin/bash -l        a login shell, so /etc/profile.d welcome + PATH apply
; -----------------------------------------------------------------------------
[program:ttyd]
command                 = /usr/local/bin/ttyd --port %(ENV_TTYD_PORT)s --interface 127.0.0.1 --base-path %(ENV_TTYD_BASE_PATH)s --writable --terminal-type xterm-256color --max-clients 20 --ping-interval 30 --client-option fontSize=14 --client-option scrollback=5000 --client-option disableLeaveAlert=true --client-option titleFixed=terminal /bin/bash -l
priority                = 20
autostart               = true
autorestart             = true
startsecs               = 3
startretries            = 1000
stopwaitsecs            = 10
stopsignal              = TERM
environment             = HOME="/root",TERM="xterm-256color"
redirect_stderr         = false
stdout_logfile          = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile          = /dev/stderr
stderr_logfile_maxbytes = 0

; -----------------------------------------------------------------------------
; ngrok — one tunnel, port 8080, which is every route the browser needs.
; The authtoken is added to ngrok's config by entrypoint.sh from the
; NGROK_AUTHTOKEN environment variable; it is never baked into the image.
; -----------------------------------------------------------------------------
[program:ngrok]
command                 = /usr/local/bin/ngrok http %(ENV_NGINX_PORT)s --log=stdout --log-format=logfmt
priority                = 30
autostart               = true
autorestart             = true
startsecs               = 3
startretries            = 1000
stopwaitsecs            = 10
stopsignal              = TERM
environment             = HOME="/root"
redirect_stderr         = false
stdout_logfile          = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile          = /dev/stderr
stderr_logfile_maxbytes = 0

; -----------------------------------------------------------------------------
; Firebase writer — polls http://localhost:4040/api/tunnels and PUTs the
; public URL to the Realtime Database with plain curl. The browser is never
; involved: no Firebase SDK, no external fetch in the page.
; -----------------------------------------------------------------------------
[program:tunnel-url-writer]
command                 = /usr/local/bin/tunnel-url-writer.sh
priority                = 40
autostart               = true
autorestart             = true
startsecs               = 0
startretries            = 1000
stopwaitsecs            = 5
stopsignal              = TERM
environment             = HOME="/root",PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
redirect_stderr         = false
stdout_logfile          = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile          = /dev/stderr
stderr_logfile_maxbytes = 0

; -----------------------------------------------------------------------------
; keepalive — the free tier pauses services that look idle, and a tunnel that
; has gone cold is the usual cause of "the URL stopped working". Touching a
; heartbeat and hitting /healthz on a slow timer keeps the container warm.
;
; NOTE: supervisord runs every command/env string through Python %-interpolation,
; so a literal percent sign MUST be written as "%%" — a bare "%F" from a
; `date +FORMAT` argument is parsed as a float conversion and supervisord dies
; at startup with "is badly formatted: must be real number, not dict". Hence
; `date -Iseconds` (no percent signs) instead of `date +%FT%TZ`.
; -----------------------------------------------------------------------------
[program:keepalive]
command                 = /bin/bash -c 'while true; do date -u -Iseconds > /tmp/keepalive.stamp; curl -fsS -m 10 -o /dev/null "http://127.0.0.1:%(ENV_NGINX_PORT)s/healthz" || true; sleep 120; done'
priority                = 50
autostart               = true
autorestart             = true
startsecs               = 1
startretries            = 1000
stopsignal              = TERM
environment             = PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
redirect_stderr         = false
stdout_logfile          = /dev/null
stdout_logfile_maxbytes = 0
stderr_logfile          = /dev/null
stderr_logfile_maxbytes = 0
